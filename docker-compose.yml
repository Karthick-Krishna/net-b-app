version: '3.8'

services:
  banking-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: premier-banking-server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=premier_banking_jwt_super_secret_key_2026
      - JWT_REFRESH_SECRET=premier_banking_jwt_refresh_secret_key_2026
    volumes:
      - banking-data:/app/data

  banking-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: premier-banking-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - banking-server

volumes:
  banking-data:
